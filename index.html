<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weatherman Bran</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e11d48">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/Images/favicon.svg">
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/Images/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Images/icon-512.png">

  <link rel="stylesheet" href="https://unpkg.com/github-markdown-css@5.5.1/github-markdown.css">
  <style>
    body{margin:0;background:#fff}
    .container{max-width:900px;margin:2rem auto;padding:0 1rem}
    .markdown-body{box-sizing:border-box;padding:0}
    .hero{display:block;margin:0 auto 1rem auto;max-width:420px;width:55%;min-width:240px;height:auto}
    /* make images from README show a zoom cursor */
    .markdown-body img{cursor:zoom-in}
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero image -->
    <img class="hero"
         src="/Images/WxManBran_Logo.png"
         alt="Two red hurricane warning flags blowing in strong wind"
         loading="lazy">

    <article class="markdown-body" id="app">Loading…</article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  (async () => {
    try {
      const res = await fetch('README.md'); // README must be alongside index.html
      if (!res.ok) throw new Error('README.md not found');
      const md = await res.text();

      const container = document.getElementById('app');
      container.innerHTML = marked.parse(md);

      // Make ALL images clickable (open the same image in a new tab)
      container.querySelectorAll('img').forEach(img => {
        if (img.closest('a')) return; // skip if already linked
        const a = document.createElement('a');
        a.href = img.getAttribute('src');
        a.target = '_blank';
        a.rel = 'noopener';
        img.replaceWith(a);
        a.appendChild(img);
      });
    } catch (e) {
      document.getElementById('app').textContent =
        'Could not load README.md. Make sure it is in the same folder as index.html.';
    }
  })();
  </script>
</body>
</html>
