<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weatherman Bran</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e11d48">
  <!-- v1-dashboard -->

  <link rel="icon" type="image/svg+xml" href="/Images/favicon.svg">
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/Images/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Images/icon-512.png">

  <link rel="stylesheet" href="https://unpkg.com/github-markdown-css@5.5.1/github-markdown.css">
  <style>
    /* Your existing base styles */
    body{margin:0;background:#fff}
    .container{max-width:900px;margin:2rem auto;padding:0 1rem}
    .markdown-body{box-sizing:border-box;padding:0}
    .hero{display:block;margin:0 auto 1rem auto;max-width:420px;width:55%;min-width:240px;height:auto}
    .markdown-body img{max-width:100%;height:auto;cursor:zoom-in}
    .markdown-body img.shrink{max-width:520px}
    .yt-embed{position:relative;padding-bottom:56.25%;height:0;margin:1.25rem 0;background:#000;border-radius:12px;overflow:hidden}
    .yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .panel{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin:1rem 0}
    .status{font-size:.85rem;color:#6b7280;margin-top:.5rem}

    /* Dashboard styles (scoped, neutral; does not change body bg) */
    :root {
      --card: #ffffff;
      --text: #0b1220;
      --muted: #646b76;
      --border: #e7e9ee;
      --shadow: 0 6px 16px rgba(0,0,0,.06);
      --accent: #2563eb; /* needle */
    }
    #wx-dashboard {
      max-width: 1100px;
      margin: 24px auto 32px;
      padding: 0 0 0; /* inside your container */
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.35;
    }
    header.site-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 4px 0 0;
    }
    .logo { font-weight: 700; letter-spacing: 0.2px; font-size: 18px; }
    #wx-conn { color: var(--muted); font-size: 13px; }

    .cards { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: stretch; }
    @media (min-width: 860px) { .cards { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .card h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: .2px; }
    .subtle { color: var(--muted); font-size: 12px; }

    .cond-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cond-item { display: grid; gap: 2px; }
    .cond-item .label { color: var(--muted); font-size: 12px; }
    .cond-item .value { font-size: 22px; font-weight: 600; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
    .asof { margin-top: 10px; color: var(--muted); font-size: 12px; }

    .wind-wrap { display: grid; grid-template-columns: 1fr; justify-items: center; gap: 8px; }
    .wind-values { text-align: center; }
    .wind-values .speed { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .wind-values .sub { color: var(--muted); font-size: 12px; }
    .wind-cardinal { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .compass { width: 100%; max-width: 340px; min-width: 220px; aspect-ratio: 1 / 1; }
    .tick { stroke: #cdd3dc; stroke-width: 1; }
    .tick.major { stroke: #b7bfca; stroke-width: 1.4; }
    .ring { fill: none; stroke: #dfe5ee; stroke-width: 2; }
    .labels { fill: #4a5568; font-size: 6px; font-weight: 600; }
    .needle { fill: var(--accent); stroke: var(--accent); }
    #wx-needle, #wx-needle2 { transform-box: fill-box; transform-origin: 50% 50%; transition: transform 120ms ease-out; }

    /* Optional secondary anemometer card (hidden until an2_* exists) */
    #wx-wind2 { display: none; }
  </style>
</head>

<body>

  <!-- README + YouTube embedding (unchanged) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function timeToSeconds(t){ if(!t) return 0; if(/^\d+$/.test(t)) return parseInt(t,10);
      let s=0,m; m=t.match(/(\d+)h/); if(m) s+=+m[1]*3600; m=t.match(/(\d+)m/); if(m) s+=+m[1]*60; m=t.match(/(\d+)s/); if(m) s+=+m[1]; return s||0; }
    function toYouTubeEmbed(href){
      try{
        const u=new URL(href,location.origin), host=u.hostname.replace(/^www\./,''); let id=null,start=0,list=null;
        if(host==='youtu.be'){ id=u.pathname.slice(1).split('/')[0]; start=timeToSeconds(u.searchParams.get('t')); }
        else if(host==='youtube.com'||host==='youtube-nocookie.com'){
          if(u.pathname.startsWith('/watch')){ id=u.searchParams.get('v'); start=timeToSeconds(u.searchParams.get('t')||u.searchParams.get('start')); list=u.searchParams.get('list'); }
          else if(u.pathname.startsWith('/shorts/')){ id=u.pathname.split('/shorts/')[1].split('/')[0]; }
          else if(u.pathname.startsWith('/embed/')){ id=u.pathname.split('/embed/')[1].split('/')[0]; }
        }
        if(!id) return null;
        const params=new URLSearchParams({rel:'0',modestbranding:'1',playsinline:'1'}); if(start>0) params.set('start',String(start)); if(list) params.set('list',list);
        return `https://www.youtube-nocookie.com/embed/${id}?${params.toString()}`;
      }catch(e){ return null; }
    }
    (async ()=>{ const container=document.getElementById('app');
      try{
        const res=await fetch('README.md'); if(!res.ok) throw 0; const md=await res.text(); container.innerHTML=marked.parse(md);
        container.querySelectorAll('a[href]').forEach(a=>{ const href=a.getAttribute('href'); const u=toYouTubeEmbed(href); if(!u) return;
          const wrap=document.createElement('div'); wrap.className='yt-embed'; const iframe=document.createElement('iframe'); iframe.src=u; iframe.title='YouTube video';
          iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.referrerPolicy='origin-when-cross-origin'; iframe.allowFullscreen=true;
          wrap.appendChild(iframe); a.replaceWith(wrap); });
        container.querySelectorAll('img').forEach(img=>{ const src=(img.getAttribute('src')||'').toLowerCase(); if(/(plot|chart|graph)/.test(src)) img.classList.add('shrink');
          if(img.closest('a')) return; const a=document.createElement('a'); a.href=img.getAttribute('src'); a.target='_blank'; a.rel='noopener'; img.replaceWith(a); a.appendChild(img); });
      }catch(e){ container.textContent='Could not load README.md. Make sure it is in the same folder as index.html.'; }
    })();
  </script>

  <!-- Live client: Long-poll with iOS polling fallback (Phase 1) -->
  <script>
    (function(){
      const API = 'https://api.wxmanbran.com/latest';

      // ===== Helpers =====
      const qs = (id) => document.getElementById(id);
      const setText = (el, txt) => { if (el && el.textContent !== txt) el.textContent = txt; };
      const fmtNum = (x, d=0) => {
        const n = Number(x);
        return Number.isFinite(n) ? n.toFixed(d) : '--';
      };
      const formatSLP = (inHg) => {
        const n = Number(inHg);
        return Number.isFinite(n) ? `${n.toFixed(3)} inHg` : '--';
      };
      const toMs = (x) => {
        const n = Number(x);
        if (!Number.isFinite(n)) return 0;
        return n < 1e12 ? Math.round(n * 1000) : Math.round(n);
      };
      const bestStamp = (d) => Math.max(toMs(d && d.ts), toMs(d && d.received_at));

      const CARD16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      const toCardinal = (deg) => {
        const n = Number(deg);
        if (!Number.isFinite(n)) return '--';
        const i = Math.round((((n % 360) + 360) % 360) / 22.5) % 16;
        return CARD16[i];
      };

      // Shortest-path rotation
      function makeNeedleRotator(el){
        let lastAngle = 0; // [0,360)
        let accum = 0;     // cumulative rotation
        return function rotateTo(deg){
          if (!el || !Number.isFinite(deg)) return;
          const a = ((deg % 360) + 360) % 360;
          const delta = ((a - lastAngle + 540) % 360) - 180; // [-180, 180)
          accum += delta;
          lastAngle = a;
          el.style.transform = `rotate(${accum}deg)`;
        };
      }

      // DOM refs
      const el = {
        conn: qs('wx-conn'),
        asof: qs('wx-asof'),
        temp: qs('wx-temp'), rh: qs('wx-rh'), dew: qs('wx-dew'), slp: qs('wx-slp'),
        rainrate: qs('wx-rainrate'), raintoday: qs('wx-raintoday'), solar: qs('wx-solar'), uv: qs('wx-uv'),
        windSpd: qs('wx-wind-speed'), windAvg: qs('wx-wind-avg'), windGust: qs('wx-wind-gust'), windCard: qs('wx-wind-cardinal'),
        needle: qs('wx-needle'),

        wind2Wrap: qs('wx-wind2'), needle2: qs('wx-needle2'),
        wind2Spd: qs('wx-wind2-speed'), wind2Avg: qs('wx-wind2-avg'), wind2Gust: qs('wx-wind2-gust'), wind2Card: qs('wx-wind2-cardinal'),
      };

      const rotateNeedle  = makeNeedleRotator(el.needle);
      const rotateNeedle2 = makeNeedleRotator(el.needle2);

      // Monotonic timestamp state
      let lastTs = 0;

      // Render scheduling (batch to next frame)
      let pending = null, rafId = 0;
      function scheduleRender(data){
        pending = data;
        if (!rafId) rafId = requestAnimationFrame(applyRender);
      }
      function applyRender(){
        rafId = 0;
        if (!pending) return;
        const d = pending; pending = null;

        // Timestamp / monotonic guard (2s tolerance)
        const stamp = bestStamp(d);
        if (stamp < (lastTs - 2000)) return;
        lastTs = Math.max(lastTs, stamp);

        // Values
        setText(el.temp,      fmtNum(d.iss_temp_F, 1) + ' °F');
        setText(el.rh,        fmtNum(d.iss_rh, 0) + ' %');
        setText(el.dew,       fmtNum(d.iss_dew_F, 1) + ' °F');
        setText(el.slp,       formatSLP(d.iss_slp_inHg));
        setText(el.rainrate,  fmtNum(d.iss_rainrate_inphr, 2) + ' in/hr');
        setText(el.raintoday, fmtNum(d.iss_raintoday_in, 2) + ' in');
        setText(el.solar,     fmtNum(d.iss_solar_wm2, 0) + ' W/m²');
        setText(el.uv,        fmtNum(d.iss_uv, 1));

        // Wind 1
        const dir = Number(d.iss_wdir_deg);
        const spd = Number(d.iss_wind_mph);
        const avg = Number(d.iss_wavg_mph);
        const gst = Number(d.iss_wgust10_mph);
        if (Number.isFinite(dir)) rotateNeedle(dir);
        setText(el.windSpd,  Number.isFinite(spd) ? `${spd.toFixed(1)} mph` : '--');
        setText(el.windAvg,  Number.isFinite(avg) ? avg.toFixed(1) : '--');
        setText(el.windGust, Number.isFinite(gst) ? gst.toFixed(1) : '--');
        setText(el.windCard, Number.isFinite(dir) ? `${toCardinal(dir)} ${Math.round(((dir%360)+360)%360)}°` : '--');

        // Wind 2 (optional)
        const hasAn2 = d && (Object.prototype.hasOwnProperty.call(d,'an2_wind_mph') ||
                             Object.prototype.hasOwnProperty.call(d,'an2_wdir_deg') ||
                             Object.prototype.hasOwnProperty.call(d,'an2_wavg_mph') ||
                             Object.prototype.hasOwnProperty.call(d,'an2_wgust10_mph'));
        if (hasAn2 && el.wind2Wrap){
          el.wind2Wrap.style.display = '';
          const dir2 = Number(d.an2_wdir_deg);
          const sp2  = Number(d.an2_wind_mph);
          const av2  = Number(d.an2_wavg_mph);
          const gs2  = Number(d.an2_wgust10_mph);
          if (Number.isFinite(dir2)) rotateNeedle2(dir2);
          setText(el.wind2Spd,  Number.isFinite(sp2) ? `${sp2.toFixed(1)} mph` : '--');
          setText(el.wind2Avg,  Number.isFinite(av2) ? av2.toFixed(1) : '--');
          setText(el.wind2Gust, Number.isFinite(gs2) ? gs2.toFixed(1) : '--');
          setText(el.wind2Card, Number.isFinite(dir2) ? `${toCardinal(dir2)} ${Math.round(((dir2%360)+360)%360)}°` : '--');
        } else if (el.wind2Wrap) {
          el.wind2Wrap.style.display = 'none';
        }

        // As-of timestamp (local)
        try {
          const dt = new Date(lastTs);
          const fmt = dt.toLocaleString([], { year:'numeric', month:'short', day:'2-digit', hour:'numeric', minute:'2-digit', second:'2-digit' });
          setText(el.asof, fmt);
        } catch {}
      }

      // ===== Transport (LP / Poll) =====
      const urlParams = new URLSearchParams(location.search);
      const ua = navigator.userAgent || navigator.vendor || window.opera || '';
      const isTouchMac = /Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || isTouchMac;

      const paramMode = urlParams.get('mode'); // lp|poll
      let mode = (paramMode === 'lp' || paramMode === 'poll') ? paramMode : (isIOS ? 'poll' : 'lp');
      let pollms = Math.max(250, parseInt(urlParams.get('pollms') || '1000', 10) || 1000);

      function setConn(text){ setText(el.conn, text); }

      let lpErrorStreak = 0;
      let lpNoChangeStreak = 0;

      async function initialFetch(){
        try {
          const res = await fetch(API, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          scheduleRender(data);
        } catch {}
      }

      async function longPollLoop(){
        setConn(`Live: long-poll`);
        const since = lastTs || 0;
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 17000);
        const url = `${API}?wait=1&since=${encodeURIComponent(since)}&timeout=15000`;
        try{
          const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
          clearTimeout(t);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const stamp = bestStamp(data);
          if (stamp <= lastTs) {
            lpNoChangeStreak++;
          } else {
            lpNoChangeStreak = 0; lpErrorStreak = 0;
            scheduleRender(data);
          }
        } catch (e){
          clearTimeout(t);
          lpErrorStreak++;
        }

        if (lpErrorStreak >= 2 || lpNoChangeStreak >= 2) {
          mode = 'poll';
          pollLoop();
        } else {
          if (mode === 'lp') longPollLoop();
        }
      }

      async function pollLoop(){
        setConn(`Live: polling (${pollms}ms)`);
        try{
          const res = await fetch(API, { cache: 'no-store' });
          if (res.ok){
            const data = await res.json();
            scheduleRender(data);
          }
        }catch(e){}
        if (mode === 'poll') setTimeout(pollLoop, pollms);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          fetch(API, { cache:'no-store' })
            .then(r => r.ok ? r.json() : null)
            .then(d => d && scheduleRender(d))
            .catch(()=>{});
        }
      });

      // Kick off
      initialFetch().finally(() => {
        if (mode === 'lp') longPollLoop(); else pollLoop();
      });
    })();
  </script>
