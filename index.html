<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weatherman Bran</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e11d48">
  <!-- v-iphone-fallback -->

  <link rel="icon" type="image/svg+xml" href="/Images/favicon.svg">
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/Images/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Images/icon-512.png">

  <link rel="stylesheet" href="https://unpkg.com/github-markdown-css@5.5.1/github-markdown.css">
  <style>
    body{margin:0;background:#fff}
    .container{max-width:900px;margin:2rem auto;padding:0 1rem}
    .markdown-body{box-sizing:border-box;padding:0}
    .hero{display:block;margin:0 auto 1rem auto;max-width:420px;width:55%;min-width:240px;height:auto}
    .markdown-body img{max-width:100%;height:auto;cursor:zoom-in}
    .markdown-body img.shrink{max-width:520px}
    .yt-embed{position:relative;padding-bottom:56.25%;height:0;margin:1.25rem 0;background:#000;border-radius:12px;overflow:hidden}
    .yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .panel{border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin:1rem 0}
    .status{font-size:.85rem;color:#6b7280;margin-top:.5rem}
  </style>
</head>

<body>
  <div class="container">
    <img class="hero" src="/Images/WxManBran_Logo.png" alt="Two red hurricane warning flags blowing in strong wind" loading="lazy">

    <div class="panel">
      <h3>ISS (Station 0)</h3>
      <div>Temp: <span id="iss_temp">--</span> °F</div>
      <div>RH: <span id="iss_rh">--</span> %</div>
      <div>Dewpoint: <span id="iss_dew">--</span> °F</div>
      <div>SLP: <span id="iss_slp">--</span> inHg</div>
      <div>Rain rate: <span id="iss_rainrate">--</span> in/hr</div>
      <div>Rain today: <span id="iss_raintoday">--</span> in</div>
      <div>Solar: <span id="iss_solar">--</span> W/m²</div>
      <div>UV: <span id="iss_uv">--</span></div>
      <div>Wind: <span id="iss_wspd">--</span> mph @ <span id="iss_wdir">--</span></div>
      <div>Avg: <span id="iss_wavg">--</span> mph | Gust(10m): <span id="iss_wgst">--</span> mph</div>
      <div class="status" id="conn_status">Connecting…</div>
    </div>

    <div class="panel">
      <h3>Second Anemometer</h3>
      <div>Wind: <span id="an2_wspd">--</span> mph @ <span id="an2_wdir">--</span></div>
      <div>Avg: <span id="an2_wavg">--</span> mph | Gust(10m): <span id="an2_wgst">--</span> mph</div>
    </div>

    <div>As of: <span id="asof">--</span></div>
    <article class="markdown-body" id="app">Loading…</article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function timeToSeconds(t){ if(!t) return 0; if(/^\d+$/.test(t)) return parseInt(t,10);
      let s=0,m; m=t.match(/(\d+)h/); if(m) s+=+m[1]*3600; m=t.match(/(\d+)m/); if(m) s+=+m[1]*60; m=t.match(/(\d+)s/); if(m) s+=+m[1]; return s||0; }
    function toYouTubeEmbed(href){
      try{
        const u=new URL(href,location.origin), host=u.hostname.replace(/^www\./,''); let id=null,start=0,list=null;
        if(host==='youtu.be'){ id=u.pathname.slice(1).split('/')[0]; start=timeToSeconds(u.searchParams.get('t')); }
        else if(host==='youtube.com'||host==='youtube-nocookie.com'){
          if(u.pathname.startsWith('/watch')){ id=u.searchParams.get('v'); start=timeToSeconds(u.searchParams.get('t')||u.searchParams.get('start')); list=u.searchParams.get('list'); }
          else if(u.pathname.startsWith('/shorts/')){ id=u.pathname.split('/shorts/')[1].split('/')[0]; }
          else if(u.pathname.startsWith('/embed/')){ id=u.pathname.split('/embed/')[1].split('/')[0]; }
        }
        if(!id) return null;
        const params=new URLSearchParams({rel:'0',modestbranding:'1',playsinline:'1'}); if(start>0) params.set('start',String(start)); if(list) params.set('list',list);
        return `https://www.youtube-nocookie.com/embed/${id}?${params.toString()}`;
      }catch(e){ return null; }
    }
    (async ()=>{ const container=document.getElementById('app');
      try{
        const res=await fetch('README.md'); if(!res.ok) throw 0; const md=await res.text(); container.innerHTML=marked.parse(md);
        container.querySelectorAll('a[href]').forEach(a=>{ const href=a.getAttribute('href'); const u=toYouTubeEmbed(href); if(!u) return;
          const wrap=document.createElement('div'); wrap.className='yt-embed'; const iframe=document.createElement('iframe'); iframe.src=u; iframe.title='YouTube video';
          iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.referrerPolicy='origin-when-cross-origin'; iframe.allowFullscreen=true;
          wrap.appendChild(iframe); a.replaceWith(wrap); });
        container.querySelectorAll('img').forEach(img=>{ const src=(img.getAttribute('src')||'').toLowerCase(); if(/(plot|chart|graph)/.test(src)) img.classList.add('shrink');
          if(img.closest('a')) return; const a=document.createElement('a'); a.href=img.getAttribute('src'); a.target='_blank'; a.rel='noopener'; img.replaceWith(a); a.appendChild(img); });
      }catch(e){ container.textContent='Could not load README.md. Make sure it is in the same folder as index.html.'; }
    })();
  </script>

  <!-- Live client: Long-poll with auto-fallback to 1s polling (iPhone-safe + monotonic render) -->
  <script>
    (() => {
      const API_BASE = new URL("https://api.wxmanbran.com");
      const LATEST_URL = new URL("/latest", API_BASE).href;
      const statusEl = document.getElementById('conn_status');

      const FIELDS = [
        ["iss_temp","iss_temp_F",v=>fmt(v,1)],
        ["iss_rh","iss_rh",v=>fmt(v,0)],
        ["iss_dew","iss_dew_F",v=>fmt(v,1)],
        ["iss_slp","iss_slp_inHg",v=>fmt(v,3)],
        ["iss_rainrate","iss_rainrate_inphr",v=>fmt(v,2)],
        ["iss_raintoday","iss_raintoday_in",v=>fmt(v,2)],
        ["iss_solar","iss_solar_wm2",v=>fmt(v,0)],
        ["iss_uv","iss_uv",v=>fmt(v,1)],
        ["iss_wspd","iss_wind_mph",v=>fmt(v,1)],
        ["iss_wdir","iss_wdir_deg",v=>degFmt(v)],
        ["iss_wavg","iss_wavg_mph",v=>fmt(v,1)],
        ["iss_wgst","iss_wgust10_mph",v=>fmt(v,1)],
        ["an2_wspd","an2_wind_mph",v=>fmt(v,1)],
        ["an2_wdir","an2_wdir_deg",v=>degFmt(v)],
        ["an2_wavg","an2_wavg_mph",v=>fmt(v,1)],
        ["an2_wgst","an2_wgust10_mph",v=>fmt(v,1)],
      ];

      function setStatus(s){ if(statusEl) statusEl.textContent = s; }
      function fmt(v,d){ return Number.isFinite(v)?v.toFixed(d):"--"; }
      function degFmt(v){ if(!Number.isFinite(v)) return "--"; return `${Math.round(v)}° (${toCardinal(v)})`; }
      function toCardinal(deg){ const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSW","SW","WSW","W","WNW","NW","NNW"]; const idx=Math.round(((deg%360)/22.5))%16; return dirs[idx]; }

      // --- ms helpers & monotonic guard ---
      function toMs(x){ return (typeof x==="number" && x>0) ? (x < 1e12 ? x*1000 : x) : 0; }
      function bestStamp(d){
        const a = toMs(d.ts);
        const b = toMs(d.received_at);
        return Math.max(a, b);
      }

      let lastTs = 0; // ms-based, monotonic
      function maybeRender(d){
        const stamp = bestStamp(d);
        if (!stamp) return;
        // Never allow the UI to go backward (2s tolerance for clock skew)
        if (stamp >= lastTs - 2000) {
          if (stamp > lastTs) lastTs = stamp;
          for (const [id,key,format] of FIELDS){
            const el=document.getElementById(id); if(!el) continue;
            const val=d[key]; el.textContent=(typeof val==="number"&&Number.isFinite(val))?format(val):"--";
          }
          const asof=document.getElementById("asof");
          if (asof){ asof.textContent=new Date(lastTs || Date.now()).toLocaleString(); }
        }
      }

      // Default to polling on iOS/touch-Mac (more reliable there)
      function isIOS(){
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const touchMac = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        return /iPhone|iPad|iPod/i.test(ua) || touchMac;
      }
      const modeParam = new URLSearchParams(location.search).get('mode');
      let forceMode = modeParam === 'lp' ? 'lp' : (modeParam === 'poll' ? 'poll' : null);
      if (!forceMode && isIOS()) forceMode = 'poll';

      // Initial fetch then choose strategy
      fetch(LATEST_URL, { cache: "no-store" })
        .then(r=>r.ok?r.json():null)
        .then(d=>{ if(d){ maybeRender(d); } })
        .finally(() => {
          if (forceMode === 'poll') startPolling();
          else startLongPollWithFallback();
        });

      function startLongPollWithFallback(){
        setStatus(forceMode==='lp' ? "Live: long-poll" : "Live: auto (LP→poll if needed)");
        let failures = 0;

        const loop = async () => {
          try{
            const params = new URLSearchParams({ wait:"1", since:String(lastTs || Date.now()), timeout:"15000" });
            const ctrl = new AbortController();
            const t = setTimeout(()=>ctrl.abort(), 17000);
            const res = await fetch(`${LATEST_URL}?${params}`, { cache: "no-store", signal: ctrl.signal });
            clearTimeout(t);

            if (!res.ok) throw new Error("HTTP "+res.status);
            const d = await res.json();
            maybeRender(d);
            failures = 0;
            setTimeout(loop, 0);
          }catch(e){
            failures++;
            if (!forceMode && failures >= 2){
              setStatus("Live: polling (fallback)");
              startPolling();
              return;
            }
            setTimeout(loop, 500);
          }
        };
        loop();
      }

      function startPolling(){
        setStatus("Live: polling");
        const run = async ()=>{
          try{
            const res = await fetch(LATEST_URL, { cache:"no-store" });
            if (res.ok){
              const d = await res.json();
              maybeRender(d);
            }
          }catch(e){}
        };
        run();
        setInterval(run, 1000);
      }

      // Snap to fresh data when returning to the tab
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          fetch(LATEST_URL, { cache:"no-store" })
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d) maybeRender(d); })
            .catch(()=>{});
        }
      });
    })();
  </script>

  <!-- Tips:
    • Force modes via URL:
      - https://www.wxmanbran.com/?mode=lp&v=iphonefix
      - https://www.wxmanbran.com/?mode=poll&v=iphonefix
    • Raw endpoints for quick checks:
      - https://api.wxmanbran.com/latest
      - https://api.wxmanbran.com/latest.txt
  -->
</body>
</html>
