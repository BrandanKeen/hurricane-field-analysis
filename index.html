<!--
  WxManBran Live Dashboard — Phase 1
  Version: v1-dashboard-final+wind-typography-hotfix
  Changes in this build:
    • Wind needle is an inward-pointing arrow (tail on ring, tip toward center)
    • Instantaneous wind font size +1 step
    • “Sustained() / Gust()” labels bold (black), values remain blue
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Weatherman Bran</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#e11d48">

  <link rel="icon" type="image/svg+xml" href="/Images/favicon.svg">
  <link rel="apple-touch-icon" href="/Images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/Images/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/Images/icon-512.png">
  <link rel="stylesheet" href="https://unpkg.com/github-markdown-css@5.5.1/github-markdown.css">

  <style>
    :root{
      --card:#fff; --bg:#f6f7f9; --text:#0b1220; --muted:#667085; --border:#e6e8ee; --shadow:0 6px 16px rgba(0,0,0,.06);
      --temp:#d62728; --dew:#2ca02c; --rh:#b58900; --slp:#111111; --rainrate:#6f3fa4; --raintotal:#7b3f00; --solar:#f97316; --uv:#1e1b4b; --accent:#2563eb; --title-ink:#111;
      --title-scale:1.35;
    }
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }

    .container{max-width:1100px;margin:20px auto 32px;padding:0 16px}
    .hero{display:block;margin:0 auto 1rem auto;max-width:420px;width:55%;min-width:240px;height:auto}

    #wx-dashboard{display:grid;gap:22px}
    header.site-header{display:flex;justify-content:flex-end;align-items:center}
    #wx-conn{font-size:13px;color:var(--muted)}

    .cards{display:grid;gap:22px}
    @media (min-width:860px){.cards{grid-template-columns:1fr 1fr}}

    .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:34px 22px 60px}
    .card h2{margin:0 0 26px;text-align:center;font-weight:800;font-size:calc(clamp(18px,2.2vw,22px) * var(--title-scale))}

    .gear{position:absolute;right:12px;bottom:12px}
    .gear summary{list-style:none;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .gear summary::-webkit-details-marker{display:none}
    .gear[open] summary{box-shadow:0 6px 18px rgba(0,0,0,.12)}
    .gear .panel{position:absolute;right:0;bottom:40px;min-width:260px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 34px rgba(0,0,0,.16);padding:10px;display:grid;gap:10px}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;font-size:13px}
    .menu-grid label{display:flex;align-items:center;gap:6px}

    /* Conditions */
    .cond-grid{display:grid;gap:28px 34px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;direction:rtl;margin-top:20px}
    .cond-item{direction:ltr}
    @media (max-width:560px){.cond-grid{grid-template-columns:1fr}} /* future task may adjust */

    .cond-item{display:grid;gap:8px}
    .cond-item .label{font-weight:800;font-size:clamp(15px,1.9vw,19px); color:var(--title-ink)}
    .cond-item .value{font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums;font-size:clamp(28px,4.4vw,40px)}
    .asof{position:absolute;left:22px;bottom:14px;color:var(--muted);font-size:12px}
    .hidden{display:none!important}

    /* Wind */
    .wind-wrap{display:grid;grid-template-columns:1fr;justify-items:center;gap:14px}
    .wind-values{width:100%;max-width:360px;text-align:center}
    /* +1 step on instant wind size */
    .wind-values .speed{font-size:clamp(27px,3.8vw,35px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
    .wind-values .wind-cardinal{font-size:14px;font-weight:800;color:#475569;margin-top:8px;margin-bottom:6px}
    .wind-values .wind-line{font-size:14px;margin-top:6px;color:var(--title-ink)}
    .wind-values .wind-line .wlbl{font-weight:700} /* bold Sustained/Gust label */

    .compass{width:100%;max-width:340px;min-width:220px;aspect-ratio:1/1}
    .ring{fill:none;stroke:#dfe5ee;stroke-width:2}
    .tick{stroke:#cdd3dc;stroke-width:1}
    .tick.major{stroke:#b7bfca;stroke-width:1.4}
    .labels{fill:#4a5568;font-size:6px;font-weight:700}
    .arrow{fill:var(--accent);stroke:var(--accent)}
    #wx-needle,#wx-needle2{transform-box:fill-box;transform-origin:50% 50%;transition:transform 140ms ease-out}

    /* Label/value colors */
    .value-temp{color:var(--temp)} .value-dew{color:var(--dew)} .value-rh{color:var(--rh)} .value-slp{color:var(--slp)}
    .value-rainrate{color:var(--rainrate)} .value-raintoday{color:var(--raintotal)} .value-solar{color:var(--solar)} .value-uv{color:var(--uv)}

    /* README (kept) */
    .markdown-body{box-sizing:border-box;padding:0}
    .markdown-body img{max-width:100%;height:auto;cursor:zoom-in}
    .markdown-body img.shrink{max-width:520px}
    .yt-embed{position:relative;padding-bottom:56.25%;height:0;margin:1.25rem 0;background:#000;border-radius:12px;overflow:hidden}
    .yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    /* README loader (kept) */
    function timeToSeconds(t){ if(!t) return 0; if(/^\d+$/.test(t)) return parseInt(t,10); let s=0,m; m=t.match(/(\d+)h/); if(m) s+=+m[1]*3600; m=t.match(/(\d+)m/); if(m) s+=+m[1]*60; m=t.match(/(\d+)s/); if(m) s+=+m[1]; return s||0; }
    function toYouTubeEmbed(href){
      try{
        const u=new URL(href,location.origin), host=u.hostname.replace(/^www\./,''); let id=null,start=0,list=null;
        if(host==='youtu.be'){ id=u.pathname.slice(1).split('/')[0]; start=timeToSeconds(u.searchParams.get('t')); }
        else if(host==='youtube.com'||host==='youtube-nocookie.com'){
          if(u.pathname.startsWith('/watch')){ id=u.searchParams.get('v'); start=timeToSeconds(u.searchParams.get('t')||u.searchParams.get('start')); list=u.searchParams.get('list'); }
          else if(u.pathname.startsWith('/shorts/')){ id=u.pathname.split('/shorts/')[1].split('/')[0]; }
          else if(u.pathname.startsWith('/embed/')){ id=u.pathname.split('/embed/')[1].split('/')[0]; }
        }
        if(!id) return null;
        const params=new URLSearchParams({rel:'0',modestbranding:'1',playsinline:'1'}); if(start>0) params.set('start',String(start)); if(list) params.set('list',list);
        return `https://www.youtube-nocookie.com/embed/${id}?${params.toString()}`;
      }catch(e){ return null; }
    }
    (async ()=>{ const container=document.getElementById('app');
      try{
        const res=await fetch('README.md'); if(!res.ok) throw 0; const md=await res.text(); container.innerHTML=marked.parse(md);
        container.querySelectorAll('a[href]').forEach(a=>{ const href=a.getAttribute('href'); const u=toYouTubeEmbed(href); if(!u) return;
          const wrap=document.createElement('div'); wrap.className='yt-embed'; const iframe=document.createElement('iframe'); iframe.src=u; iframe.title='YouTube video';
          iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.referrerPolicy='origin-when-cross-origin'; iframe.allowFullscreen=true;
          wrap.appendChild(iframe); a.replaceWith(wrap); });
        container.querySelectorAll('img').forEach(img=>{ const src=(img.getAttribute('src')||'').toLowerCase(); if(/(plot|chart|graph)/.test(src)) img.classList.add('shrink');
          if(img.closest('a')) return; const a=document.createElement('a'); a.href=img.getAttribute('src'); a.target='_blank'; a.rel='noopener'; img.replaceWith(a); a.appendChild(img); });
      }catch(e){ container.textContent=''; }
    })();
  </script>

  <script>
    /* Live engine (unchanged logic) */
    (() => {
      const API = "https://api.wxmanbran.com/latest";
      const conn = document.getElementById('wx-conn');

      const units = { temp:'F', dew:'F', slp:'mb', wind:'mph', rainrate:'inphr', rain:'in' };
      function bindUnitSelect(id,key){ const s=document.getElementById(id); if(!s) return; s.addEventListener('change',()=>{ units[key]=s.value; render(lastData); }); }
      bindUnitSelect('uTempCard','temp'); bindUnitSelect('uDewCard','dew'); bindUnitSelect('uSLPCard','slp'); bindUnitSelect('uRainRateCard','rainrate'); bindUnitSelect('uRainCard','rain');

      const f2c=f=>(f-32)*5/9, inHg2hPa=i=>i*33.8638866667, in2mm=i=>i*25.4, mph2kt=m=>m*0.868976, mph2kmh=m=>m*1.609344, mph2mps=m=>m*0.44704;
      const windNum = m => units.wind==='kt'?mph2kt(m):units.wind==='kmh'?mph2kmh(m):units.wind==='mps'?mph2mps(m):m;
      const windUnit= () => units.wind==='kmh'?'km/h':(units.wind==='mps'?'m/s':units.wind);
      const fmtTemp=(v,key)=>!isFinite(v)?'--':(units[key]==='C'?`${f2c(v).toFixed(1)} °C`:`${(+v).toFixed(1)} °F`);
      const fmtPress=v=>!isFinite(v)?'--':((units.slp==='hPa'||units.slp==='mb')?`${inHg2hPa(+v).toFixed(1)} ${units.slp}`:`${(+v).toFixed(3)} inHg`);
      const fmtRainRate=v=>!isFinite(v)?'--':(units.rainrate==='mmphr'?`${in2mm(+v).toFixed(2)} mm/hr`:`${(+v).toFixed(2)} in/hr`);
      const fmtRain=v=>!isFinite(v)?'--':(units.rain==='mm'?`${in2mm(+v).toFixed(2)} mm`:`${(+v).toFixed(2)} in`);
      const fmtWind=v=>!isFinite(+v)?'--':`${windNum(+v).toFixed(1)} ${windUnit()}`;
      const toCard = d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round((((d%360)+360)%360)/22.5)%16];

      function needleRotator(el){ let last=0,acc=0; return function(deg){ const a=((deg%360)+360)%360; const delta=((a-last+540)%360)-180; acc+=delta; last=a; el.style.transform=`rotate(${acc}deg)`; }; }
      const rotate1 = needleRotator(document.getElementById('wx-needle'));
      const rotate2 = needleRotator(document.getElementById('wx-needle2'));

      (function wireCustomizeCond(){
        const grid = document.getElementById('wx-values');
        if (!grid.__order) grid.__order = Array.from(grid.children).map(el=>el.id);
        const order = grid.__order;
        function isVisible(el){ return el && !el.classList.contains('hidden'); }
        function insertAtOriginalPosition(el){
          const idx = order.indexOf(el.id);
          for (let j = idx+1; j < order.length; j++){
            const next = document.getElementById(order[j]);
            if (isVisible(next)) { grid.insertBefore(el, next); return; }
          }
          grid.appendChild(el);
        }
        document.querySelectorAll('#gear-conditions input[type="checkbox"][data-target]').forEach(cb=>{
          cb.addEventListener('change', ()=>{
            const el = document.getElementById(cb.dataset.target);
            if(!el) return;
            if(cb.checked){
              insertAtOriginalPosition(el);
              el.classList.remove('hidden'); el.classList.add('anim-in');
              setTimeout(()=>el.classList.remove('anim-in'), 180);
            } else {
              el.classList.add('anim-out'); setTimeout(()=>{ el.classList.remove('anim-out'); el.classList.add('hidden'); }, 120);
            }
          });
        });
      })();

      (function(){
        const gears = () => Array.from(document.querySelectorAll('details.gear'));
        document.addEventListener('click', (e)=>{ gears().forEach(d => { if (d.open && !d.contains(e.target)) d.removeAttribute('open'); }); });
        document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') gears().forEach(d => d.removeAttribute('open')); });
        gears().forEach(d => d.addEventListener('toggle', ()=>{ if (d.open) gears().forEach(o => { if (o!==d) o.removeAttribute('open'); }); }));
      })();

      const windPeriodSel = document.getElementById('windPeriodCard');
      function windPeriodMinutes(){ const v = windPeriodSel?.value || '5'; return parseInt(v,10)||5; }
      windPeriodSel?.addEventListener('change', ()=> updateWindStats());
      let windBuf1 = [], windBuf2 = [];
      function pushWind(buf, mph){ const now = Date.now(); buf.push({t:now, v:+mph||0}); const cutoff = now - 60*60*1000; while(buf.length && buf[0].t < cutoff) buf.shift(); }
      function computeAvgAndGust(buf, minutes){ const cutoff = Date.now() - minutes*60*1000; const win = buf.filter(s=>s.t>=cutoff); if (!win.length) return {avg:NaN, gust:NaN}; const avg = win.reduce((a,s)=>a+s.v,0)/win.length; const gust = win.reduce((m,s)=> s.v>m?s.v:m, 0); return {avg, gust}; }

      function toMs(x){ return (typeof x==="number" && x>0) ? (x < 1e12 ? x*1000 : x) : 0; }
      function bestStamp(d){ return Math.max(toMs(d.ts), toMs(d.received_at)); }
      let lastTs = 0, lastData = null;

      function set(el,txt){ if(el && el.textContent !== txt) el.textContent = txt; }

      function render(d){
        if (!d) return;
        const stamp = bestStamp(d);
        if (stamp && stamp >= lastTs - 2000) lastTs = Math.max(lastTs, stamp);

        set(document.getElementById('wx-temp'), fmtTemp(+d.iss_temp_F, 'temp'));
        set(document.getElementById('wx-dew'),  fmtTemp(+d.iss_dew_F,  'dew'));
        set(document.getElementById('wx-rh'),   Number.isFinite(+d.iss_rh) ? `${Math.round(+d.iss_rh)} %` : '--');
        set(document.getElementById('wx-slp'),  fmtPress(+d.iss_slp_inHg));
        set(document.getElementById('wx-rainrate'),  fmtRainRate(+d.iss_rainrate_inphr));
        set(document.getElementById('wx-raintoday'), fmtRain(+d.iss_raintoday_in));
        set(document.getElementById('wx-solar'), Number.isFinite(+d.iss_solar_wm2) ? `${Math.round(+d.iss_solar_wm2)} W/m²` : '--');
        set(document.getElementById('wx-uv'),   Number.isFinite(+d.iss_uv) ? (+d.iss_uv).toFixed(1) : '--');

        const dir1 = +d.iss_wdir_deg, spd1 = +d.iss_wind_mph;
        if (Number.isFinite(dir1)) rotate1(dir1);
        pushWind(windBuf1, spd1);
        set(document.getElementById('wx-wind-speed'), fmtWind(spd1));
        set(document.getElementById('wx-wind-cardinal'), Number.isFinite(dir1) ? `${toCard(dir1)} ${Math.round(((dir1%360)+360)%360)}°` : '--');

        const hasAn2 = Number.isFinite(+d.an2_wind_mph) || Number.isFinite(+d.an2_wdir_deg);
        const an2Card = document.getElementById('wx-wind2');
        if (hasAn2 && an2Card.style.display === 'none') an2Card.style.display = '';
        if (hasAn2){
          const dir2 = +d.an2_wdir_deg, spd2 = +d.an2_wind_mph;
          if (Number.isFinite(dir2)) rotate2(dir2);
          pushWind(windBuf2, spd2);
          set(document.getElementById('wx-wind2-speed'), fmtWind(spd2));
          set(document.getElementById('wx-wind2-cardinal'), Number.isFinite(dir2) ? `${toCard(dir2)} ${Math.round(((dir2%360)+360)%360)}°` : '--');
        }

        updateWindStats();
        set(document.getElementById('wx-asof'), new Date(lastTs || Date.now()).toLocaleString());
        lastData = d;
      }

      function updateWindStats(){
        const mins = windPeriodMinutes();
        const a1 = computeAvgAndGust(windBuf1, mins);
        set(document.getElementById('wx-wind-avg'),  isNaN(a1.avg)?'--':`${windNum(a1.avg).toFixed(1)} ${windUnit()}`);
        set(document.getElementById('wx-wind-gust'), isNaN(a1.gust)?'--':`${windNum(a1.gust).toFixed(1)} ${windUnit()}`);
        set(document.getElementById('wx-wind-period'), `${mins} min`);
        set(document.getElementById('wx-wind-period2'), `${mins} min`);

        const an2Card = document.getElementById('wx-wind2');
        if (an2Card.style.display !== 'none'){
          const a2 = computeAvgAndGust(windBuf2, mins);
          set(document.getElementById('wx-wind2-avg'),  isNaN(a2.avg)?'--':`${windNum(a2.avg).toFixed(1)} ${windUnit()}`);
          set(document.getElementById('wx-wind2-gust'), isNaN(a2.gust)?'--':`${windNum(a2.gust).toFixed(1)} ${windUnit()}`);
          set(document.getElementById('wx-wind2-period'),  `${mins} min`);
          set(document.getElementById('wx-wind2-period2'), `${mins} min`);
        }
      }

      function setConn(s){ if(conn) conn.textContent = s; }
      function isIOS(){ const ua = navigator.userAgent || navigator.vendor || window.opera; const touchMac = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); return /iPhone|iPad|iPod/i.test(ua) || touchMac; }
      const qs = new URLSearchParams(location.search);
      const force = qs.get('mode');
      const pollMS = Math.max(250, +(qs.get('pollms')||1000)|0);

      fetch(API, { cache: "no-store" })
        .then(r=>r.ok?r.json():Promise.reject(r.status))
        .then(d=>{ render(d); })
        .catch(err => { setConn('Error loading initial data'); console.error('Initial fetch error:', err); })
        .finally(() => {
          if (force === 'poll' || (!force && isIOS())) startPolling();
          else startLongPoll();
        });

      function startPolling(){
        setConn(`Live: polling (${pollMS}ms)`);
        const tick = async ()=>{
          try{
            const r = await fetch(API, { cache: "no-store" });
            if (r.ok) render(await r.json());
          }catch(e){ console.error('Polling error:', e); }
        };
        tick(); setInterval(tick, pollMS);
      }

      function startLongPoll(){
        setConn('Live: long-poll');
        let failures = 0;
        (async function loop(){
          try{
            const since = String(lastTs || Date.now());
            const url = `${API}?wait=1&since=${encodeURIComponent(since)}&timeout=15000`;
            const ctrl = new AbortController();
            const t = setTimeout(()=>ctrl.abort(), 17000);
            const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
            clearTimeout(t);
            if (!r.ok) throw new Error(String(r.status));
            render(await r.json());
            failures = 0;
            setTimeout(loop, 0);
          }catch(e){
            failures++;
            if (!force && failures >= 2){
              setConn(`Live: polling (${pollMS}ms) (fallback)`); startPolling(); return;
            }
            setTimeout(loop, 500);
          }
        })();
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) fetch(API, { cache:"no-store" })
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d) render(d); })
          .catch(()=>{});
      });

    })();
  </script>
</body>
</html>
